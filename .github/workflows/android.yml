name: Android CI

on:
push:
branches: [""]
pull_request:
branches: [""]
workflow_dispatch:

permissions:
contents: read

concurrency:
group: android-build-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Detect Gradle project
    id: project
    shell: bash
    run: |
      if [ ! -f "./gradlew" ]; then
        echo "::error::Gradle wrapper not found in repository root."
        exit 1
      fi

      chmod +x ./gradlew

      echo "Gradle wrapper found."

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build debug APK
    run: ./gradlew assembleDebug --stacktrace

  - name: Run unit tests
    run: ./gradlew testDebugUnitTest

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: nepali-calendar-debug-apk
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 14

  - name: Build summary
    if: success()
    run: |
      echo "## Android Build Successful" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "The debug APK was built and uploaded as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
      echo "Download it from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
